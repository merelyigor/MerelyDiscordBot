# Хуки Codex цього проєкту. Перед кожною shell-командою агента
# scripts/hooks/guard-command.sh звіряє її зі списком
# scripts/hooks/dangerous-commands.txt і блокує збіг.

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/hooks/guard-command.sh"'
timeout = 15
statusMessage = "Перевірка команди за списком небезпечних"
